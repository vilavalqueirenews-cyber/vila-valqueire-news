<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel de Administracao - Vila Valqueire News</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="../img/logo-header.png" alt="Vila Valqueire News" class="login-logo-img">
                <h1>Vila Valqueire <span>News</span></h1>
                <p>Painel de Administracao</p>
                <p class="subtitle">JSMuniz Publicidade</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Usuario
                    </label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuario" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="error-message" id="loginError" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Usuario ou senha incorretos.</span>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Entrar no Painel</span>
                </button>
                
                <div class="login-footer">
                    <a href="../index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
                </div>
            </form>
            
            <div class="login-security">
                <i class="fas fa-shield-alt"></i>
                <span>Conexao segura - Acesso restrito</span>
            </div>
        </div>
    </div>

    <script src="js/admin-auth.js"></script>
</body>
</html>
